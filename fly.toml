# Orchestrateur des caisses POS — Fly.io.
# Après `fly launch` (ou `fly deploy`), l'URL publique est https://<app>.fly.dev
#   → dashboard à la racine, API sous /api/*.
app = "simple-sale-orchestrator"

primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  # La base vit sur NEON (secret DATABASE_URL), plus aucun volume disque.
  # DATABASE_URL, ADMIN_PASSWORD, SMS_WEBHOOK_TOKEN et OPS_TOKEN se posent via
  # `flyctl secrets set` (jamais dans ce fichier commité).
  PORT = "8080"
  PRICE_PER_MONTH_FCFA = "10000"
  TRIAL_DAYS = "30"
  # Relais ops (boîte aux lettres) — public, pas un secret.
  OPS_RELAY_URL = "https://simple-sale-orchestrator.vercel.app"

[[http_service]]
  internal_port = 8080
  force_https = true
  # Caisse en continu : pas de scale-to-zero, une machine toujours debout.
  auto_stop_machines = false
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 20
